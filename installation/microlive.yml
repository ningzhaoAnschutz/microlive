name: microlive
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.10
  - pip
  # Core scientific stack via conda (prevents pip resolution issues)
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.13
  - scikit-image=0.24
  - scikit-learn=1.5
  - matplotlib=3.9
  - numba=0.60
  - llvmlite=0.43
  - dask=2024.8
  - distributed=2024.8
  # PyTorch for Cellpose (MPS acceleration on Apple Silicon)
  - pytorch::pytorch=2.4
  - pytorch::torchvision=0.19
  - pip:
    # Install MicroLive package (which pulls remaining dependencies)
    - microlive
